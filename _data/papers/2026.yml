  title: "OpenThoughts-Agent: Data Recipes for Agentic Models"
  authors: "Negin Raoof, Richard Zhuang, Marianna Nezhurina, Etash Guha, ..., <u>Harsh Raj</u>, et al."
  url: "https://arxiv.org/abs/2606.24855"
  abstract: >
    Open data curation for training agentic models lags far behind the closed pipelines used by frontier labs. OpenThoughts-Agent (OT-Agent) closes this gap with a fully open data recipe for agentic post-training. Through over 100 controlled ablations, we assemble a 100K-example training set and fine-tune Qwen3-32B to reach 44.8% average accuracy across seven agentic benchmarks, a 3.9 point improvement over the strongest prior open-data agentic model.
