  title: "Consistency as a Testable Property: Statistical Methods to Evaluate AI Agent Reliability"
  authors: "<u>Harsh Raj</u>, Niranjan Orkat, Suvrorup Mukherjee, Aritra Guha, Cheryl Flynn, Subhabrata Majumdar"
  venue: "NeurIPS 2026"
  url: "https://arxiv.org/abs/2605.10516"
  abstract: >
    Standard performance benchmarks tell us how often an AI agent succeeds, but not how reliably it behaves. We frame consistency as a testable statistical property and develop methods to measure agent reliability across semantic variations of a task and across repeated trajectories. We show that trajectory-level consistency metrics surface agent vulnerabilities far more effectively than aggregate accuracy, enabling sharper diagnosis of architectural weaknesses before deployment in demanding applications.
