<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Drug Development Workflow Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: home is a left-to-right taxonomy tree (cycle > block > section > essentials) wired with curved connectors.
   Below it sits the full catalogue, which drills down block > section > detail. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --surface2:#edf1ef; --hover:#e8eeeb;
  --ink:#15201e; --muted:#51625d; --faint:#7c8b86; --line:#d5dedb; --wire:#c3cfcb;
  --accent:#0d6558; --accent-soft:#d7ebe6; --rule:#2c6b3c; --judg:#8c5410; --unc:#8c2f39;
  --p-gui:#2a78d6; --p-scr:#eb6834; --p-pipe:#1baf7a; --p-plat:#eda100; --p-doc:#e87ba4;
  --rootbg:#15201e; --rootfg:#f5f7f6; --rootline:#15201e;
  --display:"Spectral",Georgia,serif;
  --body:"Source Sans 3",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1413; --surface:#161d1c; --surface2:#1b2423; --hover:#1f2a28;
  --ink:#e7eeeb; --muted:#9aa9a4; --faint:#7d8d88; --line:#273331; --wire:#34433f;
  --accent:#4ecdb3; --accent-soft:#173b35; --rule:#7cc991; --judg:#dfa858; --unc:#e98a93;
  --p-gui:#3987e5; --p-scr:#d95926; --p-pipe:#199e70; --p-plat:#c98500; --p-doc:#d55181;
  --rootbg:#1b2423; --rootfg:#e7eeeb; --rootline:#2f5a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1413; --surface:#161d1c; --surface2:#1b2423; --hover:#1f2a28;
  --ink:#e7eeeb; --muted:#9aa9a4; --faint:#7d8d88; --line:#273331; --wire:#34433f;
  --accent:#4ecdb3; --accent-soft:#173b35; --rule:#7cc991; --judg:#dfa858; --unc:#e98a93;
  --p-gui:#3987e5; --p-scr:#d95926; --p-pipe:#199e70; --p-plat:#c98500; --p-doc:#d55181;
  --rootbg:#1b2423; --rootfg:#e7eeeb; --rootline:#2f5a52; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.narrow{max-width:900px;margin:0 auto}
h1{font:600 clamp(28px,4.4vw,42px)/1.08 var(--display);margin:8px 0 0;letter-spacing:-.012em;text-wrap:balance}
h2{font:600 clamp(20px,2.8vw,26px)/1.22 var(--display);margin:0;text-wrap:balance}
h3{font:600 17px/1.35 var(--body);margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
a:hover{border-bottom-color:var(--accent)}
.eyebrow{font:500 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.lede{color:var(--muted);max-width:64ch;margin-top:12px;font-size:16.5px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.crumb{display:flex;gap:7px;align-items:center;flex:1 1 200px;min-width:0;font:500 12.5px var(--mono);color:var(--faint);flex-wrap:wrap}
.crumb button{appearance:none;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:500 12.5px var(--mono)}
.crumb button:hover{text-decoration:underline}
.crumb .now{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52ch}
.search{flex:0 1 250px;min-width:0;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 14px var(--body);outline:none}
.search span{font:500 11px var(--mono);color:var(--faint)}

/* ================= TREE ================= */
.treehead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-top:22px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
.dot.GUI{background:var(--p-gui)} .dot.Scripted{background:var(--p-scr)} .dot.Pipeline{background:var(--p-pipe)} .dot.Platform{background:var(--p-plat)} .dot.Documents{background:var(--p-doc)}
.gmark{display:inline-block;width:12px;height:12px;border:1.5px solid var(--rule);border-radius:3px;position:relative;flex:0 0 auto}
.gmark::after{content:"";position:absolute;left:3px;top:0.5px;width:3px;height:6px;border:solid var(--rule);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}

.tree{position:relative;display:grid;grid-template-columns:168px 250px 262px minmax(0,1fr);column-gap:54px;margin-top:20px;padding:46px 26px 28px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1.25}
.wires path.on{stroke:var(--accent);stroke-width:1.75}
.col{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0}
.col.c0{justify-content:flex-start}
.col.c1,.col.c2{justify-content:flex-start}
.colh{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);position:absolute;top:-16px;left:0;white-space:nowrap}
.root{display:grid;gap:6px;padding:16px 16px;border-radius:14px;background:var(--rootbg);color:var(--rootfg);border:1px solid var(--rootline)}
.root b{font:600 19px/1.15 var(--display);text-wrap:balance}
.root small{font:500 10.5px/1.5 var(--mono);opacity:.75;letter-spacing:.03em;display:grid}
.bl{display:flex;flex-direction:column;gap:8px}
.bnode{appearance:none;text-align:left;width:100%;align-items:start;background:transparent;border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 8px}
.bnode .k{font:500 11.5px/1.5 var(--mono);color:var(--faint);grid-row:span 2}
.bnode b{font:600 15px/1.3 var(--body)}
.bnode small{font-size:12.5px;line-height:1.4;color:var(--faint);display:block}
.bnode:hover{background:var(--hover)}
.bnode.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bnode.on .k{color:var(--accent)}
.sl{display:flex;flex-direction:column;gap:2px}
.snode{appearance:none;text-align:left;width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:34px}
.snode span.t{flex:1;min-width:0;font:500 14px/1.3 var(--body);color:var(--muted)}
.snode:hover{background:var(--hover)}
.snode:hover span.t{color:var(--ink)}
.snode.on{background:var(--surface2);border-color:var(--line)}
.snode.on span.t{color:var(--ink);font-weight:600}
.snode .gmark{opacity:.35}
.snode.on .gmark,.snode:hover .gmark{opacity:1}
.blockpara{font:400 12px/1.45 var(--mono);color:var(--faint);margin:0 0 12px 10px;max-width:30ch}

.card{position:relative;z-index:1;align-self:start;align-content:start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;gap:20px;transition:margin-top .18s ease}
.card dl{margin:0}
.card{grid-template-columns:minmax(0,1fr)}
.card > *{min-width:0}
.steps-in,.steps-in *{min-width:0}
.card .eyrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card .ey{font:500 10.5px/1.5 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.card h3{font:600 21px/1.2 var(--display)}
.card .full{font-size:13px;color:var(--faint);margin-top:4px}
.kv{display:grid;gap:4px}
.kv dt{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kv dd{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.ptag{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.callout{border-left:3px solid var(--rule);padding:3px 0 3px 12px}
.callout.j{border-left-color:var(--judg)}
.callout dt{color:var(--rule)}
.callout.j dt{color:var(--judg)}
.card .foot{margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}
.src{font:400 12px var(--mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{appearance:none;background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:8px 15px;font:500 12.5px var(--mono);cursor:pointer;white-space:nowrap}
.open:hover{filter:brightness(1.08)}
.none-r{color:var(--faint);font-style:italic}

.tflag{display:inline-block;font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:var(--bg);background:var(--accent);border-radius:4px;padding:3px 5px;flex:0 0 auto}
.bt{font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4px;padding:2px 5px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.tstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:22px}
.tsl{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.tchip{appearance:none;display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;max-width:100%;min-width:0}
.tchip:hover{border-color:var(--accent);background:var(--hover)}
.tchip .tn{font:500 12.5px var(--mono);color:var(--ink)}
.tchip .tw{font-size:13px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.tbh{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.tbh a{font:500 13px var(--mono)}
.tmeta{font-size:12.5px;color:var(--muted)}
.lnk{appearance:none;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.treehead{margin-top:14px!important}
.steps-in{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.steps-in > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;font:500 10.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.steps-in > summary::-webkit-details-marker{display:none}
.steps-in > summary i{font-style:normal;color:var(--accent);letter-spacing:.04em}
.steps-in[open] > summary i{visibility:hidden}
.steps-in > summary:hover{color:var(--ink)}
.slist{padding:2px 10px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:1px}
.wstep{border-radius:8px}
.steps-in .slist{min-width:0}
.wstep,.wstep > summary,.wstep.flat{min-width:0;max-width:100%}
.wstep > summary,.wstep.flat{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;list-style:none;border-radius:8px;font:400 13.5px/1.45 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.wstep.flat{cursor:default}
.wstep > summary::-webkit-details-marker{display:none}
.wstep > summary::before{content:"\203A";color:var(--faint);font-size:14px;line-height:1;transition:transform .15s ease;flex:0 0 auto}
.wstep[open] > summary::before{transform:rotate(90deg)}
.wstep.flat::before{content:"\00B7";color:var(--faint);padding:0 4px}
.wstep > summary:hover{background:var(--surface2);color:var(--ink)}
.wstep[open] > summary{color:var(--ink);font-weight:600}
.sdet p,.sdet li{overflow-wrap:anywhere}
.wstep .sp{flex:1;min-width:0;overflow-wrap:anywhere}
.wstep.on > summary,.wstep.flat.on{color:var(--ink);font-weight:600}
.sdet{padding:2px 10px 12px 27px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.sh{font-size:14px;line-height:1.5;color:var(--ink)}
.stools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.stools li{display:grid;gap:0}
.stools b{font:600 13.5px/1.35 var(--body);color:var(--ink)}
.stools b em{font-style:normal;font:500 10.5px var(--mono);letter-spacing:.03em;color:var(--faint)}
.stools li{padding-left:11px;border-left:2px solid var(--line)}
.stools li.k-tool{border-left-color:var(--p-gui)}
.stools li.k-technique{border-left-color:var(--p-scr)}
.stools li.k-data{border-left-color:var(--p-plat)}
.stools li.k-resource{border-left-color:var(--p-pipe)}
.stools li.niche b{font-weight:500}
.stools span{font-size:13px;color:var(--muted)}
.sf{font-size:12.5px;color:var(--muted)}
.sf span{font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-right:7px}
.ssub summary{cursor:pointer;font:500 11px var(--mono);color:var(--accent);letter-spacing:.03em}
.ssub ul{margin:7px 0 0;padding-left:17px;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ssub em{font-style:normal;font:400 11px var(--mono);color:var(--faint)}
.sc{font:400 11px var(--mono)}
.steps-in li::marker{color:var(--line)}
.steps-in li.on{color:var(--ink);font-weight:600}
.steps-in li.on{display:list-item}
.steps-in li .tflag{float:right;margin:2px 0 0 8px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.flow > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.flow > div:last-child{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.flow span{display:block;font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.flow p{font-size:13.5px;line-height:1.45;color:var(--ink)}
.flow i{align-self:center;font-style:normal;color:var(--accent);font-size:16px}
.kv dt .ptag{margin-left:8px;text-transform:none;letter-spacing:0}
.tools{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:7px}
.tools li{display:grid;gap:1px}
.tools b{font:600 14.5px/1.35 var(--body);color:var(--ink)}
.tools span{font-size:13.5px;line-height:1.45;color:var(--muted)}
.hint{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.hint span{display:block;font:500 10.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.hint p{font-size:14px;line-height:1.5;color:var(--ink)}
.lb{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;flex:0 0 auto;font-style:normal}
.lb > i{display:block;height:100%;border-radius:3px;background:var(--accent);opacity:.75}
.lb.q-fair > i{opacity:.45}
.lb.q-poor > i{background:var(--faint);opacity:.5}
.lit{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.lith{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lith span{font:500 10.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.qc{font:500 10px/1 var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:3px 6px;border:1px solid var(--line);color:var(--muted)}
.qc.q-good{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.qc.q-poor{color:var(--unc);border-color:color-mix(in srgb,var(--unc) 45%,transparent)}
.litn{font-size:13.5px;color:var(--muted)}
.litn b{color:var(--ink);font-weight:600}
.lit ul{margin:0;padding-left:16px;display:grid;gap:5px;font-size:13px;line-height:1.4}
.lit ul span{color:var(--faint);font:400 11px var(--mono)}
.ot{font:500 9.5px/1 var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 5px;margin-left:4px;white-space:nowrap;border:1px solid var(--line);color:var(--faint)}
.ot-yes{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.ot-no{color:var(--unc);border-color:color-mix(in srgb,var(--unc) 45%,transparent)}
.lit li.on-no a{color:var(--muted)}
.better{font-size:13px;color:var(--ink);background:var(--surface2);border-radius:8px;padding:8px 10px}
.better span{display:block;font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--judg);margin-bottom:2px}
.lit details.q summary{cursor:pointer;font:500 10.5px var(--mono);color:var(--accent);letter-spacing:.04em}
.lit details.q code{display:block;margin-top:6px;font:400 11px/1.5 var(--mono);color:var(--muted);background:var(--surface2);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.wstep > summary{display:grid!important;grid-template-columns:12px minmax(0,1fr) auto;align-items:start;column-gap:9px;row-gap:5px}
.wstep > summary::before{grid-column:1;grid-row:1;padding-top:2px}
.wstep > summary .sp{grid-column:2;grid-row:1}
.wstep > summary > .dot{grid-column:3;grid-row:1;margin-top:5px}
.wstep > summary > .tflag{grid-column:3;grid-row:2}
.wstep > summary .mods{grid-column:2 / span 2;grid-row:2}
.mods{display:flex;flex-wrap:wrap;gap:4px}
.mod{font:600 9.5px/1 var(--mono);font-style:normal;letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:999px;white-space:nowrap}
.mod.m-sm{background:#dbe8fb;color:#1c4f91}
.mod.m-ab{background:#f9dfe9;color:#8e2453}
.mod.m-adc{background:#fbe6c8;color:#7c4a00}
.mod.m-any{background:var(--surface2);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mod.m-sm{background:#1d3352;color:#9cc4f5}:root:not([data-theme="light"]) .mod.m-ab{background:#47202f;color:#f2a5c3}:root:not([data-theme="light"]) .mod.m-adc{background:#43300f;color:#f2c47c}}
:root[data-theme="dark"] .mod.m-sm{background:#1d3352;color:#9cc4f5}
:root[data-theme="dark"] .mod.m-ab{background:#47202f;color:#f2a5c3}
:root[data-theme="dark"] .mod.m-adc{background:#43300f;color:#f2c47c}
.dsrc{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft);border-radius:9px;padding:10px 12px;display:grid;gap:7px}
.dsh{font:500 10px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.dsrc ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.dsrc li{display:grid;gap:1px;min-width:0}
.dsrc li a{border-bottom:0}
.dsrc li b{font:600 13px/1.35 var(--body);color:var(--ink)}
.did{font:400 11px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.dwhat{font-size:12.5px;color:var(--muted)}
.dmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.dmeta em{font:500 9.5px/1 var(--mono);font-style:normal;padding:3px 5px;border-radius:4px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.dmeta em.a-open{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.dnone{font-size:12.5px;color:var(--muted);font-style:italic}
/* stacked tree for narrow screens */
.vtree{display:none;margin-top:22px}
.vtree ul{list-style:none;margin:0;padding:0}
.vroot{display:inline-grid;gap:4px;padding:12px 15px;border-radius:12px;background:var(--rootbg);color:var(--rootfg);border:1px solid var(--rootline)}
.vroot b{font:600 18px/1.15 var(--display)}
.vroot small{font:500 10.5px var(--mono);opacity:.75}
.vtree > ul{margin-left:14px;border-left:1.25px solid var(--wire);padding-top:8px}
.vtree li{position:relative;padding-left:20px}
.vtree li::before{content:"";position:absolute;left:0;top:23px;width:14px;border-top:1.25px solid var(--wire)}
.vtree li.on::before{border-top-color:var(--accent)}
.vtree li ul{margin-left:12px;border-left:1.25px solid var(--wire);margin-bottom:6px}
.vtree li ul li::before{top:17px}
.vtree .card{margin:6px 0 12px;background:var(--surface)}
.vtree li.on > .card{margin-left:-30px}
.vtree li ul{margin-left:8px}

/* ================= CATALOGUE ================= */
.sectionh{margin-top:64px;display:grid;gap:8px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:18px}
.tile{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer}
.tile:hover{background:var(--hover);border-color:var(--accent)}
.tile .no{font:500 11px/1 var(--mono);color:var(--accent);letter-spacing:.06em}
.tile b{font:600 16px/1.3 var(--body)}
.tile small{color:var(--faint);font:500 11.5px/1.4 var(--mono)}
.sects{display:grid;gap:8px;margin-top:20px}
.sect{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer}
.sect:hover{background:var(--hover);border-color:var(--accent)}
.sect b{font:600 15.5px/1.35 var(--body);min-width:0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{font:500 10.5px/1 var(--mono);letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:4px 6px;color:var(--faint);white-space:nowrap}
.chip.r{color:var(--rule);border-color:color-mix(in srgb,var(--rule) 40%,transparent)}
.chip.j{color:var(--judg);border-color:color-mix(in srgb,var(--judg) 40%,transparent)}
.chip.u{color:var(--unc);border-color:color-mix(in srgb,var(--unc) 40%,transparent)}
.ov{color:var(--muted);font-size:15px;display:grid;gap:8px;margin-top:14px;max-width:76ch}
.hd{border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:8px;margin-top:8px}
.hd .tag{font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.proc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px;min-width:0}
.proc h3{margin-bottom:12px}
.proc dl{display:grid;gap:10px;margin:0}
.f{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;min-width:0}
.f dt{font:500 10.5px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.f dd{margin:0;font-size:14.5px;color:var(--muted);min-width:0;max-width:72ch}
.f dd.ink{color:var(--ink)}
.cites{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px}
.cite{font:400 11px/1 var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.cite:hover{color:var(--accent);border-color:var(--accent)}
.unc{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.05em;color:var(--unc);border:1px solid color-mix(in srgb,var(--unc) 45%,transparent);border-radius:4px;padding:3px 5px;vertical-align:1px}
.rj{display:grid;gap:10px;margin-top:16px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px 17px;background:var(--surface);min-width:0}
.panel.r{border-left:3px solid var(--rule)}
.panel.j{border-left:3px solid var(--judg)}
.panel h4{margin:0 0 9px;font:500 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.panel.r h4{color:var(--rule)}
.panel.j h4{color:var(--judg)}
.panel ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14px;color:var(--muted);max-width:74ch}
.panel li::marker{color:var(--line)}
.blabel{font:500 11px var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:22px}
.sechd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.steps{display:flex;gap:8px;justify-content:space-between;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.step{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font:500 12.5px var(--mono);color:var(--muted);cursor:pointer;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.step:disabled{opacity:.35;cursor:default}
.hits{display:grid;gap:8px;margin-top:18px}
.hit{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 15px;cursor:pointer;min-width:0}
.hit:hover{background:var(--hover);border-color:var(--accent)}
.hit b{display:block;font:600 14.5px/1.35 var(--body)}
.hit small{display:block;color:var(--faint);font:500 11px var(--mono);margin-top:4px}
.none{color:var(--faint);font:400 14px var(--mono);margin-top:20px}
footer{margin-top:56px;border-top:1px solid var(--line);padding-top:15px;font:400 12px/1.7 var(--mono);color:var(--faint);max-width:900px}

@media (max-width:1060px){
  .tree{display:none}
  .vtree{display:block}
}
@media (max-width:620px){
  .f{grid-template-columns:1fr;gap:3px}
  .card{padding:16px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* plain wording for a task's step, matched by position in its section */
function plainStep(k){
  const f = /^b(\d+)-(\d+)$/.exec(k.at); if(!f) return k.step;
  const sub = R.find(b=>b.n===+f[1])?.subs[+f[2]-1]; if(!sub) return k.step;
  const names = (sub.steps || sub.rows.map(r=>r[0])).map(x=>x.replace(/\*\*/g,""));
  const i = names.indexOf(k.step); return (i>=0 && P[k.at]) ? P[k.at][i] : k.step;
}
const tasksAt = id => K.filter(k => k.at === id || (k.also||[]).includes(id));
const blockTasks = bi => K.filter(k => T[bi].sections.some(s => s.id === k.at)).length;
const findSec = id => { for(let i=0;i<T.length;i++){ const j = T[i].sections.findIndex(s=>s.id===id); if(j>=0) return [i,j] } return null };
const secName = id => { const f = findSec(id); return f ? `${T[f[0]].label} · ${T[f[0]].sections[f[1]].label}` : id };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const URLRE = /https?:\/\/[^\s)|,]+[^\s)|,.]/g;
const host = u => { try { return new URL(u).hostname.replace(/^www\./,"") } catch(e) { return u } };
const PARA = ["GUI","Scripted","Pipeline","Platform","Documents"];
const PLAB = {GUI:"Point-and-click",Scripted:"Scripts and notebooks",Pipeline:"Pipelines",Platform:"Validated platforms",Documents:"Regulated documents"};

function fmt(t){
  let s = esc(t);
  s = s.replace(/\*\*UNCITED\*\*/g, '<span class="unc">UNCITED</span>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[(.+?)\]\((https?:\/\/[^)]+)\)/g, (m,a,b)=>`<a href="${b}" target="_blank" rel="noopener">${a}</a>`);
  s = s.replace(URLRE, u => `<a href="${u}" target="_blank" rel="noopener">${host(u)}</a>`);
  return s;
}
function cites(t){
  const urls = [...new Set(t.match(URLRE)||[])];
  if(!urls.length) return `<span class="cite">${/UNCITED/.test(t) ? "no source found" : esc(t.slice(0,70)) || "no source"}</span>`;
  return urls.map(u=>{
    const idx = t.indexOf(u);
    let lab = t.slice(0,idx).split(/\.\s|·|\|/).pop().replace(/[—–-]\s*$/,"").trim();
    if(!lab || lab.length > 44) lab = host(u);
    return `<a class="cite" href="${u}" target="_blank" rel="noopener" title="${esc(lab)} — ${esc(u)}">${esc(lab)}</a>`;
  }).join("");
}
const FIELDS = [["Humans and work",1],["Common concepts",2],["Software and paradigm",3],["Data and files",4]];
const nSub = R.reduce((a,b)=>a+b.subs.length,0);
const allRows = R.flatMap((b,bi)=>b.subs.flatMap((s,si)=>s.rows.map(r=>({r,bi,si,b,s}))));
const nRule = R.reduce((a,b)=>a+b.rule.length+b.subs.reduce((c,s)=>c+s.rule.length,0),0);

/* ================= TREE ================= */
let tb = 0, ts = 0;
const MODCLS = {"Small molecule":"sm","Antibody":"ab","ADC":"adc","Any":"any"};
function modPills(d){
  const m = d && d.modality; if(!m || !m.length) return "";
  return `<span class="mods">${m.map(x=>`<i class="mod m-${MODCLS[x]||"any"}">${esc(x)}</i>`).join("")}</span>`;
}
function dataBlock(d){
  if(!d) return "";
  const ds = d.data_sources||[];
  if(!ds.length) return d.no_data_reason ? `<div class="dsrc"><span class="dsh">Where to get real data</span><p class="dnone">${esc(d.no_data_reason)}</p></div>` : "";
  return `<div class="dsrc"><span class="dsh">Where to get real data</span><ul>${ds.map(s=>`<li>
    <a href="${esc(s.url)}" target="_blank" rel="noopener"><b>${esc(s.name)}</b></a>
    <span class="did">${esc(s.repo)}${s.id?` · ${esc(s.id)}`:""}</span>
    <span class="dwhat">${esc(s.what)}</span>
    <span class="dmeta">${s.format?`<em>${esc(s.format)}</em>`:""}${s.size?`<em>${esc(s.size)}</em>`:""}<em class="acc a-${esc(s.access)}">${esc(s.access)}</em></span></li>`).join("")}</ul></div>`;
}
function stepList(bi, si, id){
  const sub = R[bi]?.subs[si];
  const orig = sub ? (sub.steps || sub.rows.map(r=>r[0])).map(x=>x.replace(/\*\*/g,"")) : [];
  const plain = P[id] && P[id].length===orig.length ? P[id] : orig;
  const mine = K.filter(k=>k.at===id);
  const det = SD[id] ? SD[id].steps : null;
  let items = orig.map((o,i)=>({o, p:plain[i], on: mine.some(k=>k.step===o), d: det ? det[i] : null}));
  if(!items.length) items = mine.map(k=>({o:k.step, p:k.step, on:true, d:null}));
  if(!items.length || (items.length===1 && !mine.length)) return "";
  const hit = items.some(x=>x.on);
  const body = x => {
    const d = x.d; if(!d) return "";
    const items = d.items && d.items.length ? d.items : (d.toolList||[]).map(tl=>({name:tl.name,kind:"Tool",does:tl.does}));
    const tools = items.map(it=>`<li class="k-${esc((it.kind||"Tool").toLowerCase())}${it.common==="niche"?" niche":""}"><b>${esc(it.name)} <em>(${esc(it.kind||"Tool")})</em></b><span>${esc(it.does)}${it.common && it.common!=="standard"?` · ${esc(it.common)}`:""}</span></li>`).join("");
    const subs = (d.substeps||[]).map(s=>`<li>${esc(s.plain)}${s.tool?` <em>${esc(s.tool)}</em>`:""}</li>`).join("");
    return `<div class="sdet">
      ${d.human?`<p class="sh">${esc(d.human)}</p>`:""}
      ${tools?`<ul class="stools">${tools}</ul>`:""}
      ${(!d.items||!d.items.length) && d.files && !/^Not described/i.test(d.files)?`<p class="sf"><span>Data</span>${esc(d.files)}</p>`:""}
      ${dataBlock(d)}
      ${subs?`<details class="ssub"><summary>${(d.substeps||[]).length} kinds of this work</summary><ul>${subs}</ul></details>`:""}
      ${d.cite&&d.cite.url?`<p class="sc"><a href="${esc(d.cite.url)}" target="_blank" rel="noopener">${esc(d.cite.label||host(d.cite.url))}</a></p>`:""}
    </div>`;
  };
  const row = x => x.d
    ? `<details class="wstep${x.on?" on":""}"><summary><span class="sp">${esc(x.p)}</span>${modPills(x.d)}${x.d.paradigm?`<i class="dot ${x.d.paradigm}" title="${PLAB[x.d.paradigm]||""}"></i>`:""}${x.on?'<i class="tflag">task</i>':""}</summary>${body(x)}</details>`
    : `<div class="wstep flat${x.on?" on":""}"><span class="sp">${esc(x.p)}</span>${x.on?'<i class="tflag">task</i>':""}</div>`;
  return `<details class="steps-in"${hit||det?" open":""}><summary><span>Steps</span><i>show</i></summary>
    <div class="slist">${items.map(row).join("")}</div></details>`;
}
function tCard(bi, si){
  const b = T[bi], s = b.sections[si];
  const [, bn, sn] = /^b(\d+)-(\d+)$/.exec(s.id);
  const full = R[bi]?.subs[+sn-1]?.title || "";
  return `<article class="card" id="tcard">
    <div><div class="eyrow"><span class="ey">Block ${bn}</span><span class="ey num" style="white-space:nowrap">Section ${sn} of ${b.sections.length}</span></div>
      <h3 style="margin-top:8px">${esc(s.label)}</h3>${full && full.toLowerCase()!==s.label.toLowerCase()?`<div class="full">${esc(full)}</div>`:""}</div>
    ${s.gets?`<div class="flow"><div><span>Input</span><p>${esc(s.gets)}</p></div><i aria-hidden="true">&rarr;</i><div><span>Output</span><p>${esc(s.gives)}</p></div></div>`:""}
    ${stepList(bi, +sn-1, s.id)}
    ${SD[s.id]?"":`<dl class="kv"><dt>What humans do</dt><dd>${esc(s.human)}</dd></dl>`}
    ${SD[s.id]?"":`<dl class="kv"><dt>Tools <span class="ptag"><i class="dot ${s.paradigm}"></i>${PLAB[s.paradigm]||s.paradigm}</span></dt><dd>${s.toolList?`<ul class="tools">${s.toolList.map(x=>`<li><b>${esc(x.name)}</b><span>${esc(x.does)}</span></li>`).join("")}</ul>`:esc(s.tools)}</dd></dl>`}
    ${litBox(s.id)}
    ${tasksAt(s.id).map(k=>`<div class="tbox"><div class="tbh"><span class="tflag">Our task</span><a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.name)}</a></div>
      <p>${esc(k.what)}</p>
      <p class="tmeta">${k.at===s.id?`Step: ${esc(plainStep(k))} · `:`Main home: <button class="lnk" data-jump="${k.at}">${esc(secName(k.at))}</button> · `}Method: ${esc(k.method)}${k.at===s.id && (k.also||[]).length?` · Also touches: ${k.also.map(a=>`<button class="lnk" data-jump="${a}">${esc(secName(a))}</button>`).join(", ")}`:""}</p></div>`).join("")}
    <div class="foot"><span class="src">Source: ${s.cite&&s.cite.url?`<a href="${esc(s.cite.url)}" target="_blank" rel="noopener">${esc(s.cite.label||host(s.cite.url))}</a>`:"not sourced"}</span>
      </div>
  </article>`;
}
function treeView(){
  const blocks = T.map((b,i)=>`<button class="bnode ${i===tb?"on":""}" data-tb="${i}" aria-pressed="${i===tb}"><span class="k num">${b.n}</span><b>${esc(b.label)}${blockTasks(i)?`<em class="bt">${blockTasks(i)} task${blockTasks(i)>1?"s":""}</em>`:""}</b><small>${esc(b.gist)}</small></button>`).join("");
  const secs = T[tb].sections.map((s,j)=>`<button class="snode ${j===ts?"on":""}" data-ts="${j}" aria-pressed="${j===ts}"><i class="dot ${s.paradigm}" title="${PLAB[s.paradigm]||""}"></i><span class="t">${esc(s.label)}</span>${litBar(s.id)}${tasksAt(s.id).length?'<i class="tflag" title="We have a task here">task</i>':""}</button>`).join("");
  const vt = T.map((b,i)=>`<li class="${i===tb?"on":""}"><button class="bnode ${i===tb?"on":""}" data-tb="${i}" aria-expanded="${i===tb}"><span class="k num">${b.n}</span><b>${esc(b.label)}${blockTasks(i)?`<em class="bt">${blockTasks(i)} task${blockTasks(i)>1?"s":""}</em>`:""}</b><small>${esc(b.gist)}</small></button>
      ${i===tb?`<ul>${b.sections.map((s,j)=>`<li class="${j===ts?"on":""}"><button class="snode ${j===ts?"on":""}" data-ts="${j}" aria-expanded="${j===ts}"><i class="dot ${s.paradigm}"></i><span class="t">${esc(s.label)}</span>${litBar(s.id)}${tasksAt(s.id).length?'<i class="tflag" title="We have a task here">task</i>':""}</button>${j===ts?tCard(i,j).replace('id="tcard"',''):""}</li>`).join("")}</ul>`:""}</li>`).join("");
  const legend = PARA.map(p=>`<span><i class="dot ${p}"></i>${PLAB[p]}</span>`).join("") + `<span><i class="lb q-good" style="width:34px"><i style="width:70%"></i></i>Papers per year (log scale)</span><span><i class="mod m-sm">Small molecule</i><i class="mod m-ab">Antibody</i><i class="mod m-adc">ADC</i>Drug type</span>`;
  const strip = K.map(k=>`<button class="tchip" data-jump="${k.at}"><span class="tn">${esc(k.name)}</span><span class="tw">${esc(secName(k.at))}</span></button>`).join("");
  return `<div class="narrow" style="max-width:none">
    <h1 style="margin-top:14px">Drug Development Workflow Map</h1>
  </div>
  <div class="treehead"><div class="legend" aria-label="Legend">${legend}</div></div>
  <div class="tree" id="tree">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="col c0"><span class="colh">Cycle</span><div class="root" id="troot"><b>Drug development</b></div></div>
    <div class="col c1"><span class="colh">Block</span><div class="bl" id="tbl">${blocks}</div></div>
    <div class="col c2"><span class="colh">Section</span><div class="sl" id="tsl">${secs}</div></div>
    ${tCard(tb,ts)}
  </div>
  <div class="vtree" id="vt"><div class="vroot"><b>Drug development</b></div><ul>${vt}</ul></div>
  `;
}
function elbow(px,py,sx,cx,cy){
  const r = Math.min(8, Math.abs(cy-py)/2);
  if(r < 1) return `M${px},${py} H${cx}`;
  const dir = cy > py ? 1 : -1;
  return `M${px},${py} H${sx-r} Q${sx},${py} ${sx},${py+dir*r} V${cy-dir*r} Q${sx},${cy} ${sx+r},${cy} H${cx}`;
}
function wire(){
  const tree = document.getElementById("tree"); if(!tree || getComputedStyle(tree).display==="none") return;
  const card = document.getElementById("tcard"), tsl = document.getElementById("tsl");
  const sOn = tsl.querySelector(".snode.on");
  // centre a short section list on its block so the branch stays short
  tsl.style.marginTop = "0px"; card.style.marginTop = "0px";
  { const rt = document.getElementById("troot"), bl = document.getElementById("tbl");
    rt.style.marginTop = "0px";
    const bR = bl.getBoundingClientRect(), rR = rt.getBoundingClientRect();
    rt.style.marginTop = Math.max(0, (bR.top + bR.height/2) - (rR.top + rR.height/2)) + "px"; }
  { const tR = tree.getBoundingClientRect(), lR = tsl.getBoundingClientRect();
    const bT = document.querySelector("#tbl .bnode.on b").getBoundingClientRect();
    const want = (bT.top + bT.height/2) - lR.top - lR.height/2;
    const room = (tR.bottom - 28) - lR.bottom;
    tsl.style.marginTop = Math.max(0, Math.min(want, room)) + "px"; }
  const tr0 = tree.getBoundingClientRect(), sr0 = sOn.getBoundingClientRect(), cr0 = card.getBoundingClientRect();
  const maxTop = tr0.bottom - 28 - cr0.bottom;
  const want = (sr0.top + sr0.height/2) - cr0.top - 70;
  card.style.marginTop = Math.max(0, Math.min(want, maxTop)) + "px";
  const tr = tree.getBoundingClientRect();
  const rel = el => { const r = el.getBoundingClientRect(); return {l:r.left-tr.left, r:r.right-tr.left, y:r.top-tr.top+r.height/2, t:r.top-tr.top, b:r.bottom-tr.top} };
  const root = rel(document.getElementById("troot"));
  const bnodes = [...document.querySelectorAll("#tbl .bnode")];
  const snodes = [...tsl.querySelectorAll(".snode")];
  let grey = "", on = "";
  const sx1 = root.r + 24;
  bnodes.forEach((el,i)=>{ const b = rel(el), y = rel(el.querySelector("b")).y;
    const d = `<path d="${elbow(root.r,root.y,sx1,b.l,y)}"${i===tb?' class="on"':''}/>`; if(i===tb) on += d; else grey += d });
  const bOnEl = bnodes[tb], bOn = rel(bOnEl), by = rel(bOnEl.querySelector("b")).y;
  const sx2 = bOn.r + 24;
  snodes.forEach((el,j)=>{ const s = rel(el);
    const d = `<path d="${elbow(bOn.r,by,sx2,s.l,s.y)}"${j===ts?' class="on"':''}/>`; if(j===ts) on += d; else grey += d });
  const sA = rel(sOn), c = rel(card);
  const cy = Math.min(Math.max(sA.y, c.t+30), c.b-30);
  on += `<path class="on" d="${elbow(sA.r,sA.y,(sA.r+c.l)/2,c.l,cy)}"/>`;
  document.getElementById("wires").innerHTML = grey + on;
}

/* ================= CATALOGUE ================= */
function procCard(r){
  const fields = FIELDS.map(([lab,i])=> (!r[i]||!r[i].trim()) ? "" : `<div class="f"><dt>${lab}</dt><dd${i===3?' class="ink"':''}>${fmt(r[i])}</dd></div>`).join("");
  return `<article class="proc"><h3>${fmt(r[0])}</h3><dl>${fields}</dl><div class="cites">${cites(r[5]||"")}</div></article>`;
}
function subChips(s){
  const unc = s.rows.filter(r=>/UNCITED/.test(r.join(" "))).length;
  return `<span class="chip num">${s.rows.length} step${s.rows.length===1?"":"s"}</span>`
    + (s.rule.length?`<span class="chip r num">${s.rule.length} rule-defined</span>`:"")
    + (s.judg.length?`<span class="chip j num">${s.judg.length} judgment</span>`:"")
    + (unc?`<span class="chip u num">${unc} with gaps</span>`:"");
}
function panels(rule, judg){
  return `<div class="rj">
    ${rule.length?`<div class="panel r"><h4>Rule-defined answers</h4><ul>${rule.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul></div>`:""}
    ${judg.length?`<div class="panel j"><h4>Judgment calls</h4><ul>${judg.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul></div>`:""}</div>`;
}
function catalogue(){
  const tiles = R.map(b=>{
    const steps = b.subs.reduce((a,s)=>a+s.rows.length,0);
    return `<button class="tile" data-go="b${b.n}"><span class="no">BLOCK ${b.n}</span><b>${esc(b.name)}</b><small>${b.subs.length} sections · ${steps} sub-processes</small></button>`;
  }).join("");
  return `<div class="sectionh narrow" style="max-width:none"><div class="eyebrow">Full catalogue</div><h2>Every sub-process, with its sources</h2>
    <p class="lede" style="margin-top:4px">${allRows.length} sub-processes across ${nSub} sections. Anything unsourced says <span class="unc">UNCITED</span>.</p></div>
    <div class="map">${tiles}</div>`;
}
function blockView(bi){
  const b = R[bi];
  const list = b.subs.map((s,si)=>`<button class="sect" data-go="b${b.n}-${si+1}"><b>${esc(s.title)}</b><span class="meta">${subChips(s)}</span></button>`).join("");
  return `<div class="narrow"><div class="hd"><span class="tag">Block ${b.n} of ${R.length}</span><h2>${esc(b.name)}</h2></div>
  <div class="ov">${b.overview.map(o=>`<p>${fmt(o)}</p>`).join("")}</div>
  <div class="sects">${list}</div>
  ${(b.rule.length||b.judg.length)?`<p class="blabel">Across this block</p>${panels(b.rule,b.judg)}`:""}</div>`;
}
function subView(bi,si){
  const b = R[bi], s = b.subs[si];
  const prev = si>0 ? `b${b.n}-${si}` : (bi>0 ? `b${R[bi-1].n}-${R[bi-1].subs.length}` : "");
  const next = si<b.subs.length-1 ? `b${b.n}-${si+2}` : (bi<R.length-1 ? `b${R[bi+1].n}-1` : "");
  const pL = prev ? (si>0 ? b.subs[si-1].title : R[bi-1].subs.at(-1).title) : "";
  const nL = next ? (si<b.subs.length-1 ? b.subs[si+1].title : R[bi+1].subs[0].title) : "";
  const own = s.rule.length || s.judg.length;
  return `<div class="narrow"><div class="hd"><span class="tag">Block ${b.n} · ${esc(b.name)}</span><h2>${esc(s.title)}</h2><div class="sechd">${subChips(s)}</div></div>
  ${s.rows.map(procCard).join("")}
  ${own ? panels(s.rule,s.judg) : ((b.rule.length||b.judg.length)?`<p class="blabel">Across this block</p>${panels(b.rule,b.judg)}`:"")}
  <div class="steps"><button class="step" data-go="${prev}" ${prev?"":"disabled"}>&lsaquo; ${esc(pL||"start")}</button>
    <button class="step" data-go="${next}" ${next?"":"disabled"}>${esc(nL||"end")} &rsaquo;</button></div></div>`;
}
function searchView(term){
  const t = term.toLowerCase();
  const hits = allRows.filter(({r})=>r.join(" ").toLowerCase().includes(t));
  const list = hits.slice(0,80).map(({r,b,s,si})=>`<button class="hit" data-go="b${b.n}-${si+1}"><b>${fmt(r[0])}</b><small>Block ${b.n} · ${esc(s.title)}</small></button>`).join("");
  return `<div class="narrow"><div class="hd"><span class="tag">Search</span><h2>${hits.length} sub-process${hits.length===1?"":"es"} match “${esc(term)}”</h2></div>
  ${hits.length?`<div class="hits">${list}</div>`:`<p class="none">Nothing matches. Try a software name, a standard, or a file type.</p>`}
  ${hits.length>80?`<p class="none">Showing the first 80.</p>`:""}</div>`;
}

/* ================= ROUTER ================= */
const view = document.getElementById("view"), crumb = document.getElementById("crumb"), q = document.getElementById("q"), foot = document.getElementById("foot");
function parse(){ return {k:"home"};
  const h = (location.hash||"").replace(/^#/,"");
  const m = /^b(\d+)(?:-(\d+))?$/.exec(h);
  if(!m) return {k:"home"};
  const bi = R.findIndex(b=>b.n===+m[1]); if(bi<0) return {k:"home"};
  if(m[2]){ const si = +m[2]-1; if(si>=0 && si<R[bi].subs.length) return {k:"sub",bi,si} }
  return {k:"block",bi};
}
function render(scroll){
  const st = parse(), searching = q.value.trim().length>1;
  let c = [`<button data-go="home">Map</button>`];
  if(searching){ view.innerHTML = searchView(q.value.trim()); c.push(`<span>›</span><span class="now">Search</span>`) }
  else if(st.k==="home"){ view.innerHTML = treeView(); c = [`<span class="now">Benchmark task planning · 27 October 2026</span>`] }
  else if(st.k==="block"){ view.innerHTML = blockView(st.bi); c.push(`<span>›</span><span class="now">Block ${R[st.bi].n}. ${esc(R[st.bi].name)}</span>`) }
  else { view.innerHTML = subView(st.bi,st.si); c.push(`<span>›</span><button data-go="b${R[st.bi].n}">Block ${R[st.bi].n}</button><span>›</span><span class="now">${esc(R[st.bi].subs[st.si].title)}</span>`) }
  crumb.innerHTML = c.join(" ");
  foot.textContent = "Compiled from five research passes over practitioner blogs, peer-reviewed reviews, FDA and ICH texts, and vendor documentation. Rule-defined answers can be graded by a script, judgment calls cannot. Genetic medicines (viral vectors, oligonucleotides, cell therapy) are not covered in this pass.";
  
  requestAnimationFrame(wire);
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-tb]");
  if(b){ const i = +b.dataset.tb; if(i!==tb){ tb = i; ts = 0 } render(false); return }
  const j = e.target.closest("[data-jump]");
  if(j){ const f = findSec(j.dataset.jump); if(f){ tb = f[0]; ts = f[1]; if(location.hash){ history.pushState("", "", location.pathname + location.search) } render(false); document.getElementById(innerWidth>1060?"tree":"vt")?.scrollIntoView({behavior:"smooth",block:"start"}) } return }
  const s = e.target.closest("[data-ts]");
  if(s){ ts = +s.dataset.ts; render(false); return }
  const el = e.target.closest("[data-go]");
  if(!el || el.disabled || !el.dataset.go) return;
  if(q.value) q.value = "";
  const to = el.dataset.go;
  if(to==="home"){ history.pushState("", "", location.pathname + location.search); render(true) }
  else location.hash = to;
});
document.addEventListener("keydown", e=>{
  if(parse().k!=="home" || q.value || document.activeElement===q) return;
  if(e.key==="ArrowDown"){ ts = Math.min(ts+1, T[tb].sections.length-1); render(false); e.preventDefault() }
  else if(e.key==="ArrowUp"){ ts = Math.max(ts-1, 0); render(false); e.preventDefault() }
  else if(e.key==="ArrowRight" && tb<T.length-1){ tb++; ts=0; render(false) }
  else if(e.key==="ArrowLeft" && tb>0){ tb--; ts=0; render(false) }
});
addEventListener("hashchange", ()=>render(true));
addEventListener("resize", ()=>requestAnimationFrame(wire));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(wire));
let tmr; q.addEventListener("input", ()=>{ clearTimeout(tmr); tmr = setTimeout(()=>render(false), 120) });
render(false);
</script>
